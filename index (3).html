<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô phỏng 3D - Bài toán Cứu trợ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        /* Bảng điều khiển nằm ở góc dưới bên trái, ôm sát nội dung */
        #ui-panel {
            position: absolute; bottom: 15px; left: 15px;
            width: max-content; max-width: 92vw; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px); border-radius: 12px;
            box-shadow: 0 -5px 30px rgba(0,0,0,0.15); z-index: 100; border: 1px solid rgba(255,255,255,0.4);
            max-height: calc(100vh - 30px); overflow-y: auto;
            display: flex; flex-direction: column; gap: 8px;
        }
        
        /* Kích cỡ chữ đã thu nhỏ còn một nửa (40px) */
        .point-label {
            position: absolute; font-size: 40px; font-weight: 900; pointer-events: none; z-index: 5;
            transform: translate(15px, -25px);
            text-shadow: -2px -2px 0 rgba(255,255,255,0.9), 2px -2px 0 rgba(255,255,255,0.9), -2px 2px 0 rgba(255,255,255,0.9), 2px 2px 0 rgba(255,255,255,0.9), 0px 0px 6px rgba(255,255,255,0.8);
            white-space: nowrap; transition: color 0.2s, transform 0.2s;
        }
        
        .legend-item { display: flex; align-items: center; margin-bottom: 2px; font-size: 11px; }
        .legend-color { width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
        
        /* Chữ thả hàng thành công nhấp nháy vàng rực */
        .success-text {
            position: absolute; font-size: 32px; font-weight: 900; color: #ca8a04; background: #fef08a;
            padding: 15px 30px; border-radius: 12px; border: 4px solid #eab308; pointer-events: none; z-index: 20;
            transform: translate(-50%, -150%); box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: center; white-space: nowrap;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, pulseYellow 0.4s infinite 0.4s;
        }
        
        @keyframes popIn { 0% { opacity: 0; transform: translate(-50%, -100%) scale(0.5); } 100% { opacity: 1; transform: translate(-50%, -150%) scale(1); } }
        @keyframes pulseYellow { 
            0%, 100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.8); border-color: #eab308; color: #ca8a04; background: #fef08a; transform: translate(-50%, -150%) scale(1); } 
            50% { box-shadow: 0 0 0 25px rgba(234, 179, 8, 0); border-color: #facc15; color: #a16207; background: #fff; transform: translate(-50%, -150%) scale(1.1); } 
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .vec { position: relative; display: inline-block; margin-top: 0.5em; }
        .vec::after { content: '→'; position: absolute; top: -0.9em; left: 0; width: 100%; text-align: center; font-family: Arial, sans-serif; font-size: 0.9em; font-weight: normal; line-height: 1; }
        
        /* Nút thả hàng nhấp nháy đỏ rực */
        @keyframes pulseRedButton {
            0%, 100% { background-color: #ef4444 !important; box-shadow: 0 0 10px #ef4444; color: white !important;}
            50% { background-color: #fca5a5 !important; box-shadow: 0 0 25px #ef4444; color: #991b1b !important;}
        }
        .blink-red-btn { animation: pulseRedButton 0.8s infinite !important; cursor: pointer !important; opacity: 1 !important;}

        @media (max-width: 768px) { #ui-panel { bottom: 10px; left: 10px; width: max-content; max-width: calc(100% - 20px); max-height: 60vh; } }
    </style>
</head>
<body>
    <!-- UI Panel (Góc dưới bên trái, ôm sát nội dung) -->
    <div id="ui-panel" class="p-2.5 shadow-xl">
        <!-- Phần Tọa độ & Điều khiển -->
        <div class="w-full flex flex-col gap-1.5">
            <div>
                <div class="grid grid-cols-2 gap-x-2 gap-y-1">
                    <div class="legend-item"><div class="legend-color bg-gray-800"></div> O(0;0;0)</div>
                    <div class="legend-item"><div class="legend-color bg-red-500"></div> A(2;3;5)</div>
                    <div class="legend-item"><div class="legend-color bg-blue-500"></div> B(8;6;4)</div>
                    <div class="legend-item"><div class="legend-color bg-orange-500"></div> C(4;4;7)</div>
                </div>
            </div>
            
            <!-- Các nút điều khiển chung -->
            <div class="grid grid-cols-2 gap-1.5 mt-1">
                <button id="btn-show-vectors" class="bg-blue-500 hover:bg-blue-600 text-white text-[11px] font-bold py-1.5 px-2 rounded transition shadow disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap" disabled>
                    👁 HIỆN <span class="vec font-bold">AC</span>, <span class="vec font-bold">CD</span>
                </button>
                <button id="btn-drop-cargo" class="bg-yellow-400 hover:bg-yellow-500 text-slate-900 text-[11px] font-bold py-1.5 px-2 rounded transition shadow disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    🚁 THẢ HÀNG
                </button>
                <button id="btn-storm" class="bg-red-500 hover:bg-red-600 text-white text-[11px] font-bold py-1.5 px-2 rounded transition shadow border border-red-600" title="Bật/Tắt sấm chớp">
                    ⛈ BẬT BÃO
                </button>
                <button id="btn-hide-models" class="bg-gray-600 hover:bg-gray-700 text-white text-[11px] font-bold py-1.5 px-2 rounded transition shadow">
                    🙈 ẨN MÔ HÌNH
                </button>
                <button id="btn-replay" class="col-span-2 bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold py-1.5 px-2 rounded transition shadow">
                    🔄 CHƠI LẠI
                </button>
            </div>
            <p class="text-[10px] text-slate-500 italic text-center">Chuột trái: Xoay | Chuột phải: Dịch | Cuộn: Zoom</p>
        </div>
        
        <!-- Phần Trắc nghiệm -->
        <div class="w-full bg-slate-50 p-2 rounded-lg border border-slate-200 shadow-inner flex flex-col gap-2 overflow-y-auto">
            <div id="section-a">
                <div class="space-y-1.5 text-slate-700 text-[11px] leading-relaxed">
                    <div>+ Theo đề bài thì <span class="font-mono font-bold vec">CD</span> = <input type="text" class="w-8 py-0.5 border border-gray-400 rounded text-center outline-none focus:border-blue-500 h-5" id="ans-a1"> <span class="font-mono font-bold vec">AC</span></div>
                    <div>+ Gọi <span class="font-mono">D(x;y;z)</span>, khi đó:</div>
                    <div class="pl-2"><span class="font-mono font-bold vec">CD</span> = ( <input type="text" class="w-9 py-0.5 border border-gray-400 rounded text-center outline-none focus:border-blue-500 h-5" id="ans-a2"> ; <input type="text" class="w-9 py-0.5 border border-gray-400 rounded text-center outline-none focus:border-blue-500 h-5" id="ans-a3"> ; <input type="text" class="w-9 py-0.5 border border-gray-400 rounded text-center outline-none focus:border-blue-500 h-5" id="ans-a4"> )</div>
                    <div class="pl-2"><span class="font-mono font-bold vec">AC</span> = ( <input type="text" class="w-8 py-0.5 border border-gray-400 rounded text-center outline-none focus:border-blue-500 h-5" id="ans-a5"> ; <input type="text" class="w-8 py-0.5 border border-gray-400 rounded text-center outline-none focus:border-blue-500 h-5" id="ans-a6"> ; <input type="text" class="w-8 py-0.5 border border-gray-400 rounded text-center outline-none focus:border-blue-500 h-5" id="ans-a7"> )</div>
                    
                    <div>+ Vì <span class="font-mono font-bold vec">CD</span> = <input type="text" class="w-8 py-0.5 border border-gray-400 rounded text-center outline-none focus:border-blue-500 h-5" id="ans-a8"> <span class="font-mono font-bold vec">AC</span> nên ta có hệ phương trình:</div>
                    <div class="flex items-center gap-1 pl-1 font-mono">
                        <!-- Dấu ngoặc nhọn trái -->
                        <svg class="w-2.5 self-stretch shrink-0 text-slate-700" viewBox="0 0 12 90" preserveAspectRatio="none" fill="none">
                            <path d="M11 2 C5 2 6 8 6 15 L6 37 C6 42 4 45 1 45 C4 45 6 48 6 53 L6 75 C6 82 5 88 11 88" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <div class="flex flex-col gap-1">
                            <div class="flex items-center gap-1">
                                <input type="text" class="w-9 py-0.5 border border-gray-400 rounded text-center outline-none focus:border-blue-500 h-5" id="ans-s1">
                                <span>=</span>
                                <input type="text" class="w-8 py-0.5 border border-gray-400 rounded text-center outline-none focus:border-blue-500 h-5" id="ans-s4">
                            </div>
                            <div class="flex items-center gap-1">
                                <input type="text" class="w-9 py-0.5 border border-gray-400 rounded text-center outline-none focus:border-blue-500 h-5" id="ans-s5">
                                <span>=</span>
                                <input type="text" class="w-8 py-0.5 border border-gray-400 rounded text-center outline-none focus:border-blue-500 h-5" id="ans-s8">
                            </div>
                            <div class="flex items-center gap-1">
                                <input type="text" class="w-9 py-0.5 border border-gray-400 rounded text-center outline-none focus:border-blue-500 h-5" id="ans-s9">
                                <span>=</span>
                                <input type="text" class="w-8 py-0.5 border border-gray-400 rounded text-center outline-none focus:border-blue-500 h-5" id="ans-s12">
                            </div>
                        </div>

                        <span class="px-1 font-sans font-bold text-slate-600 text-xs">⇔</span>

                        <!-- Dấu ngoặc nhọn phải -->
                        <svg class="w-2.5 self-stretch shrink-0 text-slate-700" viewBox="0 0 12 90" preserveAspectRatio="none" fill="none">
                            <path d="M11 2 C5 2 6 8 6 15 L6 37 C6 42 4 45 1 45 C4 45 6 48 6 53 L6 75 C6 82 5 88 11 88" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <div class="flex flex-col gap-1">
                            <div class="flex items-center gap-0.5">
                                <span class="w-3 inline-block">x</span><span>=</span>
                                <input type="text" class="w-8 py-0.5 border border-gray-400 rounded text-center outline-none focus:border-blue-500 h-5" id="ans-x">
                            </div>
                            <div class="flex items-center gap-0.5">
                                <span class="w-3 inline-block">y</span><span>=</span>
                                <input type="text" class="w-8 py-0.5 border border-gray-400 rounded text-center outline-none focus:border-blue-500 h-5" id="ans-y">
                            </div>
                            <div class="flex items-center gap-0.5">
                                <span class="w-3 inline-block">z</span><span>=</span>
                                <input type="text" class="w-8 py-0.5 border border-gray-400 rounded text-center outline-none focus:border-blue-500 h-5" id="ans-z">
                            </div>
                        </div>
                    </div>

                    <div class="pt-0.5">+ Vậy <span class="font-mono font-bold">D(</span> <input type="text" class="w-8 py-0.5 border border-gray-400 rounded text-center outline-none focus:border-blue-500 h-5" id="ans-d1"> ; <input type="text" class="w-8 py-0.5 border border-gray-400 rounded text-center outline-none focus:border-blue-500 h-5" id="ans-d2"> ; <input type="text" class="w-8 py-0.5 border border-gray-400 rounded text-center outline-none focus:border-blue-500 h-5" id="ans-d3"> <span class="font-mono font-bold">)</span></div>
                </div>
                <div class="flex justify-center mt-2">
                    <button id="btn-submit-a" class="w-full bg-purple-600 hover:bg-purple-700 text-white text-[11px] font-bold py-1.5 rounded transition shadow flex justify-center items-center gap-1">
                        ❤️ Gửi Đáp Án
                    </button>
                </div>
                <div id="check-result-a" class="mt-1.5 text-center font-bold text-[11px] p-1.5 rounded hidden"></div>
            </div>
        </div>
    </div>
    
    <div id="canvas-container"></div>
    <div id="labels-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // TRỤC TỌA ĐỘ VÀ HỆ THỐNG CƠ BẢN
        function mathToThree(x, y, z) { const scale = 2; return new THREE.Vector3(x * scale, z * scale, -y * scale); }

        const container = document.getElementById('canvas-container');
        const labelsContainer = document.getElementById('labels-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#79a9a8');
        scene.fog = new THREE.FogExp2('#79a9a8', 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(35, 28, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05; controls.target.copy(mathToThree(5, 5, 2));

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6); 
        dirLight.position.set(20, 50, 20); dirLight.castShadow = true; scene.add(dirLight);

        const origin = mathToThree(0,0,0);
        function createThickAxis(mathEnd, colorHex) {
            const endVec = mathToThree(mathEnd[0], mathEnd[1], mathEnd[2]);
            const length = origin.distanceTo(endVec);
            const dir = new THREE.Vector3().subVectors(endVec, origin).normalize();
            const radius = 0.15, headRadius = 0.45, headLength = 1.5;
            const shaftLength = length - headLength;
            
            const axisGroup = new THREE.Group();
            const material = new THREE.MeshLambertMaterial({ color: colorHex });
            
            const shaftGeo = new THREE.CylinderGeometry(radius, radius, shaftLength, 12); shaftGeo.rotateX(Math.PI / 2);
            const shaft = new THREE.Mesh(shaftGeo, material); shaft.position.z = shaftLength / 2; axisGroup.add(shaft);
            
            // Kéo dài thân trục về chiều âm
            const tailLength = 60;
            const tailGeo = new THREE.CylinderGeometry(radius, radius, tailLength, 12); tailGeo.rotateX(Math.PI / 2);
            const tail = new THREE.Mesh(tailGeo, material); tail.position.z = -tailLength / 2; axisGroup.add(tail);
            
            const headGeo = new THREE.ConeGeometry(headRadius, headLength, 16); headGeo.rotateX(Math.PI / 2);
            const head = new THREE.Mesh(headGeo, material); head.position.z = shaftLength + headLength / 2; axisGroup.add(head);
            
            axisGroup.position.copy(origin); axisGroup.lookAt(new THREE.Vector3().copy(origin).add(dir));
            return axisGroup;
        }

        scene.add(createThickAxis([25, 0, 0], 0xff0000));
        scene.add(createThickAxis([0, 25, 0], 0x00ff00));
        scene.add(createThickAxis([0, 0, 20], 0x0000ff));

        const tickMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
        window.axisLabelElements = []; 
        function createAxisNumber(text, mathPos) {
            const el = document.createElement('div'); el.innerText = text;
            el.style.position = 'absolute'; el.style.fontSize = '12px'; el.style.fontWeight = '600';
            el.style.color = '#334155'; el.style.pointerEvents = 'none'; el.style.zIndex = '5';
            el.style.textShadow = '-1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff';
            el.style.transform = 'translate(-50%, -50%)';
            labelsContainer.appendChild(el);
            window.axisLabelElements.push({ el: el, pos: mathToThree(mathPos[0], mathPos[1], mathPos[2]) });
        }
        
        for (let i = -25; i <= 25; i++) {
            if (i === 0) continue;
            const tick = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.6, 0.06), tickMat); tick.position.copy(mathToThree(i, 0, 0)); scene.add(tick);
            createAxisNumber(i, [i, -0.7, 0]);
        }
        for (let i = -25; i <= 25; i++) {
            if (i === 0) continue;
            const tick = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.6, 0.06), tickMat); tick.position.copy(mathToThree(0, i, 0)); scene.add(tick);
            createAxisNumber(i, [-0.7, i, 0]);
        }
        for (let i = -20; i <= 20; i++) {
            if (i === 0) continue;
            const tick = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.06, 0.06), tickMat); tick.position.copy(mathToThree(0, 0, i)); scene.add(tick);
            createAxisNumber(i, [0, -0.7, i]);
        }
        
        function createAxisLabel(text, mathPos, color) {
            const el = document.createElement('div'); el.innerHTML = `<i><b>${text}</b></i>`;
            el.style.position = 'absolute'; el.style.fontSize = '24px'; el.style.fontFamily = '"Times New Roman", Times, serif';
            el.style.color = color; el.style.pointerEvents = 'none'; el.style.zIndex = '5';
            el.style.textShadow = '-1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 0px 0px 6px rgba(255,255,255,0.8)';
            el.style.transform = 'translate(-50%, -50%)';
            labelsContainer.appendChild(el);
            window.axisLabelElements.push({ el: el, pos: mathToThree(mathPos[0], mathPos[1], mathPos[2]) });
        }
        createAxisLabel('x', [26, 0, 0], '#dc2626');
        createAxisLabel('y', [0, 26, 0], '#16a34a');
        createAxisLabel('z', [0, 0, 21], '#2563eb');

        const gridHelper = new THREE.GridHelper(100, 50, 0x94a3b8, 0xe2e8f0); 
        gridHelper.position.set(0, 0, 0); 
        scene.add(gridHelper);
        
        const plane = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.1, side: THREE.DoubleSide})); 
        plane.rotation.x = Math.PI / 2; 
        scene.add(plane);

        // MÔ HÌNH TRỰC THĂNG
        function createParkedHelicopter() {
            const heliWrapper = new THREE.Group();
            const heli = new THREE.Group();
            
            const bodyGeo = new THREE.SphereGeometry(0.45, 32, 16); bodyGeo.scale(1.4, 0.85, 0.75);
            const body = new THREE.Mesh(bodyGeo, new THREE.MeshLambertMaterial({color: 0xffcc00})); body.position.y = 0.5; heli.add(body);
            const tailGeo = new THREE.CylinderGeometry(0.06, 0.03, 1.2, 12); tailGeo.rotateZ(Math.PI / 2);
            const tail = new THREE.Mesh(tailGeo, new THREE.MeshLambertMaterial({color: 0xffcc00})); tail.position.set(-0.9, 0.5, 0); heli.add(tail);
            const fin = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.04), new THREE.MeshLambertMaterial({color: 0xffcc00})); fin.position.set(-1.4, 0.6, 0); fin.rotation.z = -Math.PI / 6; heli.add(fin);
            const windowGeo = new THREE.SphereGeometry(0.46, 16, 16, 0, Math.PI*2, 0, Math.PI/2.2); windowGeo.scale(1.35, 0.75, 0.65); windowGeo.rotateZ(-Math.PI / 4.5);
            const windowMesh = new THREE.Mesh(windowGeo, new THREE.MeshLambertMaterial({color: 0x0ea5e9})); windowMesh.position.set(0.05, 0.5, 0); heli.add(windowMesh);
            
            const rotorGroup = new THREE.Group(); rotorGroup.name = "mainRotor";
            const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.25), new THREE.MeshLambertMaterial({color: 0x334155})); mast.position.set(0.1, 0.9, 0); rotorGroup.add(mast);
            const bladeMat = new THREE.MeshLambertMaterial({color: 0x1e293b});
            const blades1 = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.02, 0.12), bladeMat); blades1.position.set(0.1, 1.02, 0); rotorGroup.add(blades1);
            const blades2 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.02, 3.2), bladeMat); blades2.position.set(0.1, 1.02, 0); rotorGroup.add(blades2);
            heli.add(rotorGroup);

            const skidMat = new THREE.MeshLambertMaterial({color: 0x0f172a});
            const skidL = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.4), skidMat); skidL.rotateZ(Math.PI/2); skidL.position.set(0, 0.05, 0.3); heli.add(skidL);
            const skidR = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.4), skidMat); skidR.rotateZ(Math.PI/2); skidR.position.set(0, 0.05, -0.3); heli.add(skidR);
            const strutGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.3);
            const strut1 = new THREE.Mesh(strutGeo, skidMat); strut1.position.set(0.3, 0.2, 0.22); strut1.rotateX(Math.PI/6); heli.add(strut1);
            const strut2 = new THREE.Mesh(strutGeo, skidMat); strut2.position.set(-0.3, 0.2, 0.22); strut2.rotateX(Math.PI/6); heli.add(strut2);
            const strut3 = new THREE.Mesh(strutGeo, skidMat); strut3.position.set(0.3, 0.2, -0.22); strut3.rotateX(-Math.PI/6); heli.add(strut3);
            const strut4 = new THREE.Mesh(strutGeo, skidMat); strut4.position.set(-0.3, 0.2, -0.22); strut4.rotateX(-Math.PI/6); heli.add(strut4);
            
            heli.rotation.y = -Math.PI / 2;
            heliWrapper.add(heli);

            return heliWrapper;
        }

        const pointData = [
            { id: 'O', coords: [0, 0, 0], color: 0x333333, showAlways: true },
            { id: 'A', coords: [2, 3, 5], color: 0xef4444, showAlways: true },
            { id: 'B', coords: [8, 6, 4], color: 0x3b82f6, showAlways: true },
            { id: 'C', coords: [4, 4, 7], color: 0xf97316, showAlways: true },
            { id: 'D', coords: [8, 6, 11], color: 0x22c55e, showAlways: false }
        ];

        const pointMeshes = {}; const labelElements = {}; const hideableModels = [];
        window.modelsDict = {}; 
        window.quizAPassed = false;
        
        const posB = mathToThree(8, 6, 4);
        const posC = mathToThree(4, 4, 7);
        const posD = mathToThree(8, 6, 11);

        function createThickDashedLine(mathP1, mathP2, colorHex) {
            const p1 = mathToThree(mathP1[0], mathP1[1], mathP1[2]);

            const distance = p1.distanceTo(p2);
            const dashLength = 0.4; const gapLength = 0.25;
            const totalDashes = Math.floor(distance / (dashLength + gapLength));
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            const radius = 0.05; 
            const group = new THREE.Group();
            for (let i = 0; i <= totalDashes; i++) {
                const cyl = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, dashLength, 8).rotateX(Math.PI/2), new THREE.MeshBasicMaterial({ color: colorHex }));
                const centerDist = i * (dashLength + gapLength) + dashLength / 2;
                if (centerDist > distance) break;
                const pos = p1.clone().add(dir.clone().multiplyScalar(centerDist));
                cyl.position.copy(pos); cyl.lookAt(p2); group.add(cyl);
            }
            return group;

        const quizAnswers = {
            'ans-a1': ['2'],
            'ans-a2': ['x-4'], 'ans-a3': ['y-4'], 'ans-a4': ['z-7'],
            'ans-a5': ['2'], 'ans-a6': ['1'], 'ans-a7': ['2'],
            'ans-a8': ['2'],
            'ans-s1': ['x-4'], 'ans-s4': ['4'],
            'ans-s5': ['y-4'], 'ans-s8': ['2'],
            'ans-s9': ['z-7'], 'ans-s12': ['4'],
            'ans-x': ['8'], 'ans-y': ['6'], 'ans-z': ['11'],
            'ans-d1': ['8'], 'ans-d2': ['6'], 'ans-d3': ['11']
        };

        function normalizeVal(v) {
            return v.trim().toLowerCase().replace(/\s+/g, '');
        }

        function markInput(el, isCorrect) {
            if (isCorrect) {
                el.classList.remove('border-red-500');
                el.classList.add('border-green-500', 'bg-green-100');
            } else {
                el.classList.remove('border-green-500', 'bg-green-100');
                el.classList.add('border-red-500');
            }
        }

        document.getElementById('btn-submit-a').addEventListener('click', () => {
            let correctCount = 0;

            for (const id of aIds) {
                const el = document.getElementById(id);
                const val = normalizeVal(el.value);
                const isCorrect = quizAnswers[id].includes(val);
                markInput(el, isCorrect);
                if (isCorrect) correctCount++;
            }

            const resultDiv = document.getElementById('check-result-a'); resultDiv.classList.remove('hidden');
            if (correctCount === aIds.length) {
                window.quizAPassed = true;
                resultDiv.innerHTML = "🎉 Chính xác!<br><span class='text-blue-700 block mt-1.5'>💡 Hãy nhấn nút 👁 để xem điều kỳ diệu!</span>";
                resultDiv.className = "mt-2 text-center font-bold text-xs p-2 rounded bg-green-100 text-green-700 border border-green-300";
                
                if (pointMeshes['D_core']) pointMeshes['D_core'].visible = true;
                if (pointMeshes['D_ring']) pointMeshes['D_ring'].visible = true;
                if (pointMeshes['D_light']) pointMeshes['D_light'].visible = true; 
                if (pointMeshes['D_projOxy']) pointMeshes['D_projOxy'].visible = true; 
                if (pointMeshes['D_projOz']) pointMeshes['D_projOz'].visible = true; 
                if (labelElements['D']) labelElements['D'].style.display = 'block';

                const btnVectors = document.getElementById('btn-show-vectors'); 
                btnVectors.disabled = false;
                if (!window.vectorGroup.visible) {
                    btnVectors.classList.add('animate-pulse', 'shadow-[0_0_15px_rgba(59,130,246,0.8)]');
                }
            } else {
                resultDiv.innerHTML = `Đúng ${correctCount}/${aIds.length} ô. Thử lại nhé!`;
                resultDiv.className = "mt-2 text-center font-bold text-xs p-2 rounded bg-red-100 text-red-700 border border-red-300";
            }
        });

        // NÚT CHƠI LẠI: Đặt lại toàn bộ trạng thái về như lượt chơi đầu tiên
        document.getElementById('btn-replay').addEventListener('click', () => {
            // 1. Xóa sạch các ô nhập liệu và trạng thái kiểm tra đáp án
            aIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.value = '';
                    el.classList.remove('border-green-500', 'bg-green-100', 'border-red-500');
                    el.classList.add('border-gray-400');
                }
            });
            const resultDiv = document.getElementById('check-result-a');
            resultDiv.classList.add('hidden');
            resultDiv.innerHTML = '';
            window.quizAPassed = false;

            // 2. Ẩn điểm D và các đường gióng của D
            if (pointMeshes['D_core']) pointMeshes['D_core'].visible = false;
            if (pointMeshes['D_ring']) pointMeshes['D_ring'].visible = false;
            if (pointMeshes['D_light']) pointMeshes['D_light'].visible = false;
            if (pointMeshes['D_projOxy']) pointMeshes['D_projOxy'].visible = false;
            if (pointMeshes['D_projOz']) pointMeshes['D_projOz'].visible = false;
            if (labelElements['D']) labelElements['D'].style.display = 'none';

            // 3. Ẩn và khóa lại nút Hiện vectơ AC, CD
            if (window.vectorGroup) window.vectorGroup.visible = false;
            const btnVectors = document.getElementById('btn-show-vectors');
            btnVectors.disabled = true;
            btnVectors.classList.remove('bg-blue-700', 'animate-pulse', 'shadow-[0_0_15px_rgba(59,130,246,0.8)]');
            btnVectors.classList.add('bg-blue-500');

            // 4. Dừng hoạt ảnh bay/thả hàng và âm thanh trực thăng
            animationState.isPlaying = false;
            animationState.progress = 0;
            animationState.isDropping = false;
            animationState.hasDropped = false;
            animationState.cargoBlinkTime = 0;
            animationState.dropIndex = 0;
            animationState.lastDropTime = 0;
            stopHelicopterSound(true);

            // 5. Đưa trực thăng trở về bãi đậu tại C
            planeGroup.position.copy(posC);
            planeGroup.rotation.set(0, -Math.PI / 4, 0);
            planeGroup.visible = window.modelsVisible !== false;

            // 6. Ẩn các gói quà và nhãn chúc mừng
            if (window.reliefPackage) {
                window.reliefPackage.visible = false;
                window.reliefPackage.children.forEach(pkg => {
                    pkg.visible = false;
                    pkg.position.set(pkg.userData.targetX, pkg.userData.targetY, pkg.userData.targetZ);
                    pkg.rotation.set(0, 0, 0);
                    pkg.children.forEach(child => {
                        if (child.userData.isHeart && child.material && child.material.emissive) {
                            child.material.emissive.setHex(0x000000);
                            child.material.emissiveIntensity = 0;
                        }
                    });
                });
            }
            if (window.successLabel) window.successLabel.style.display = 'none';

            // 7. Khóa và đặt lại nút Thả hàng về trạng thái ban đầu
            const btnDrop = document.getElementById('btn-drop-cargo');
            btnDrop.disabled = true;
            btnDrop.innerText = "🚁 THẢ HÀNG";
            btnDrop.className = "bg-yellow-400 hover:bg-yellow-500 text-slate-900 text-[11px] font-bold py-1.5 px-2 rounded transition shadow disabled:opacity-50 disabled:cursor-not-allowed";

            // Đưa con trỏ vào ô nhập đầu tiên để học sinh điền ngay
            const firstInput = document.getElementById('ans-a1');
            if (firstInput) firstInput.focus();
        });

        function updateLabels() {
            const canvasBounds = renderer.domElement.getBoundingClientRect();
            pointData.forEach(pt => {
                const id = pt.id, element = labelElements[id];
                if (element && element.style.display !== 'none') {
                    const pos = id === 'D' ? posD.clone() : (pointMeshes[id + "_core"] ? pointMeshes[id + "_core"].position.clone() : mathToThree(pt.coords[0], pt.coords[1], pt.coords[2])); pos.project(camera);
                    if (pos.z < 1) { 
                        const x = (pos.x * 0.5 + 0.5) * canvasBounds.width, y = (-(pos.y * 0.5) + 0.5) * canvasBounds.height;
                        element.style.left = `${x}px`; element.style.top = `${y}px`; element.style.opacity = 1;
                    } else { element.style.opacity = 0; }
                }
            });
            if (window.axisLabelElements) {
                window.axisLabelElements.forEach(item => {
                    const pos = item.pos.clone(); pos.project(camera);
                    if (pos.z < 1) { 
                        const x = (pos.x * 0.5 + 0.5) * canvasBounds.width, y = (-(pos.y * 0.5) + 0.5) * canvasBounds.height;
                        item.el.style.left = `${x}px`; item.el.style.top = `${y}px`; item.el.style.opacity = 1;
                    } else { item.el.style.opacity = 0; }
                });
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const timeNow = Date.now();
            
            // Mưa
            const positions = rainSystem.geometry.attributes.position.array;
            for(let i=0; i<rainCount; i++) {
                rainVelocityArray[i] -= 0.01 + Math.random() * 0.02;
                positions[i*6] -= 0.01; positions[i*6+1] += rainVelocityArray[i]; positions[i*6+3] -= 0.01; positions[i*6+4] += rainVelocityArray[i]; 
                if (positions[i*6+1] < 0) {
                    positions[i*6] = Math.random() * 100 - 50; positions[i*6+1] = 80;
                    positions[i*6+3] = positions[i*6] + 0.5; positions[i*6+4] = 80 - 2.0; rainVelocityArray[i] = 0;
                }
            }
            rainSystem.geometry.attributes.position.needsUpdate = true;

            // Sấm sét
            if (window.lightningBolts && window.modelsVisible !== false) {
                window.lightningBolts.forEach(bolt => {
                    if (Math.random() > 0.90) { 
                        bolt.visible = true; 
                        bolt.position.x = bolt.userData.baseX + (Math.random() - 0.5) * 1.5; 
                        bolt.position.z = bolt.userData.baseZ + (Math.random() - 0.5) * 1.5; 
                    } else { bolt.visible = false; }
                });
            }

            // Trực thăng quay cánh quạt
            scene.traverse(function(object) { if (object.name === "mainRotor") object.rotation.y -= 0.6; });

            // Nhấp nháy A, B, C, D
            if (window.blinkingMarkers) {
                const blinkIntensity = (Math.sin(timeNow * 0.005) + 1) / 2; 
                window.blinkingMarkers.forEach(marker => {
                    if (marker.ring) { marker.ring.material.opacity = 0.2 + blinkIntensity * 0.8; const scale = 1 + blinkIntensity * 0.25; marker.ring.scale.set(scale, scale, scale); }
                    if (marker.light) marker.light.intensity = 0.5 + blinkIntensity * 2.5;
                });
            }

            // Hoạt ảnh trực thăng bay
            if (animationState.isPlaying) {
                animationState.progress += animationState.speed;
                const startPos = pointMeshes['C_core'] ? pointMeshes['C_core'].position.clone() : mathToThree(4, 4, 7);
                const endPos = posD.clone();
                if (animationState.progress <= 1) { 
                    planeGroup.position.lerpVectors(startPos, endPos, animationState.progress); planeGroup.lookAt(endPos); 
                } else {
                    animationState.isPlaying = false; 
                    animationState.isDropping = true; 
                    
                    window.reliefPackage.position.set(planeGroup.position.x, 0, planeGroup.position.z);
                    window.reliefPackage.rotation.set(0, 0, 0);
                    window.reliefPackage.visible = window.modelsVisible !== false;
                    
                    animationState.dropIndex = 0;
                    animationState.lastDropTime = Date.now();
                    
                    window.reliefPackage.children.forEach(pkg => {
                        pkg.visible = false;
                        pkg.position.set(0, planeGroup.position.y / 1.2, 0); 
                        pkg.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
                    });
                    
                    if (typeof stopHelicopterSound === 'function') stopHelicopterSound();
                }
            }

            // Hoạt ảnh rơi hàng
            if (animationState.isDropping && window.reliefPackage) {
                const now = Date.now();
                if (now - animationState.lastDropTime > 150 && animationState.dropIndex < window.reliefPackage.children.length) {
                    window.reliefPackage.children[animationState.dropIndex].visible = window.modelsVisible !== false;
                    animationState.dropIndex++;
                    animationState.lastDropTime = now;
                }

                let allLanded = true;
                window.reliefPackage.children.forEach(pkg => {
                    if (pkg.visible) {
                        if (pkg.position.y > pkg.userData.targetY) {
                            pkg.position.y -= 0.25; 
                            pkg.position.x += (pkg.userData.targetX - pkg.position.x) * 0.1;
                            pkg.position.z += (pkg.userData.targetZ - pkg.position.z) * 0.1;
                            pkg.rotation.y += 0.1;
                            pkg.rotation.x += 0.1;
                            allLanded = false;
                            
                            if (pkg.position.y <= pkg.userData.targetY) {
                                pkg.position.set(pkg.userData.targetX, pkg.userData.targetY, pkg.userData.targetZ);
                                pkg.rotation.set(0, 0, 0); 
                            }
                        }
                    } else {
                        allLanded = false; 
                    }
                });

                if (allLanded && animationState.dropIndex >= window.reliefPackage.children.length) {
                    animationState.isDropping = false; 
                    animationState.hasDropped = true; 
                    animationState.cargoBlinkTime = Date.now();
                    const btn = document.getElementById('btn-drop-cargo');
                    if (btn) { btn.innerText = "✅ ĐÃ GIAO HÀNG"; btn.classList.replace('bg-gray-400', 'bg-blue-600'); btn.classList.add('cursor-default'); }
                    if (window.successLabel && window.modelsVisible !== false) window.successLabel.style.display = 'block';
                }
            }

            // Hàng rớt xong -> Phát sáng nhấp nháy liên tục
            if (animationState.hasDropped && window.reliefPackage) {
                const timeElapsed = timeNow - animationState.cargoBlinkTime;
                const glowIntensity = (Math.sin(timeElapsed * 0.005) + 1) / 2; 
                window.reliefPackage.children.forEach(pkg => {
                    pkg.children.forEach(child => {
                        if (child.userData.isHeart && child.material && child.material.emissive) {
                            child.material.emissive.setHex(0xff1493);
                            child.material.emissiveIntensity = glowIntensity * 0.8;
                        }
                    });
                });
                
                if (window.successLabel && window.successLabel.style.display === 'block') {
                    const canvasBounds = renderer.domElement.getBoundingClientRect(); const labelPos = window.reliefPackage.position.clone();
                    labelPos.y += 1.5; labelPos.project(camera);
                    if (labelPos.z < 1) { 
                        const x = (labelPos.x * 0.5 + 0.5) * canvasBounds.width, y = (-(labelPos.y * 0.5) + 0.5) * canvasBounds.height;
                        window.successLabel.style.left = `${x}px`; window.successLabel.style.top = `${y}px`;
                    }
                }
            }

            controls.update(); renderer.render(scene, camera); updateLabels();
        }

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

        animate();
    </script>
</body>
</html>
